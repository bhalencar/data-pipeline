version: 2

models:
  - name: master_orders
    columns:
      - name: order_sn
        tests:
          - not_null
      - name: item_id
        tests:
          - not_null
      - name: item_sku
        tests:
          - not_null
      - name: cmv_unitario
        data_tests:
          - not_null:
              config:
                where: "create_time >= '2026-06-01'"

      - name: margem_item
        data_tests:
          - not_null:
              config:
                where: "create_time >= '2026-06-01'"