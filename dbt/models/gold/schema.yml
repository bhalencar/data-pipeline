version: 2

models:
  - name: master_orders
    description: >
      Tabela final de vendas da Casa e Patas na Shopee. Cada linha e um produto
      dentro de um pedido: se o cliente comprou 3 itens diferentes, sao 3 linhas;
      se comprou 2 variacoes do mesmo produto, tambem sao 2 linhas.
      Para contar PEDIDOS use count(distinct order_sn), nunca count(*).
      Grao: order_sn + item_id + model_id.

    columns:
      - name: canal
        description: >
          Marketplace de origem do pedido. Hoje constante em 'shopee' -- e o unico
          canal. Existe desde ja porque a despesa_operacional tambem tem canal, e
          o DRE por canal precisa dos dois lados. Quando o Mercado Livre entrar,
          so muda a origem do valor.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['shopee', 'mercado_livre']
              config:
                severity: warn

      - name: order_sn
        description: "Numero do pedido na Shopee, igual ao do painel do vendedor. Use count(distinct order_sn) para contar pedidos."
        tests:
          - not_null

      - name: item_id
        description: "Codigo interno da Shopee para o produto pai."
        tests:
          - not_null

      - name: model_id
        description: "Codigo interno da Shopee para a variacao (cor, tamanho). Nulo em produtos sem variacao."

      - name: item_sku
        description: "SKU cadastrado no nivel do produto pai. Vem vazio em produtos com variacao: prefira sku_custo."
        tests:
          - not_null

      - name: sku_custo
        description: "SKU efetivo do que foi vendido: usa model_sku quando existe, senao item_sku. E a chave para agrupar por produto e para buscar o custo."

      - name: item_name
        description: "Nome do produto como aparece no anuncio."

      - name: model_name
        description: "Nome da variacao vendida, por exemplo 'Marrom-Escuro|Potes-Preto'."

      - name: order_status
        description: >
          Situacao do pedido. Oito valores ja observados, do mais cru ao final:
          UNPAID, READY_TO_SHIP, PROCESSED, SHIPPED, TO_CONFIRM_RECEIVE,
          TO_RETURN, CANCELLED e COMPLETED.
          SEMPRE filtre por este campo em analises financeiras: CANCELLED tem
          repasse zero e UNPAID nunca foi pago, e os dois distorcem qualquer media.
          O accepted_values abaixo e proposital como WARN, nao como ERROR: status
          novo da Shopee nao e defeito do pipeline, e um aviso de que o dicionario
          precisa de uma linha nova.
        data_tests:
          # dbt 1.12 exige os argumentos do teste generico aninhados em `arguments`.
          # Sem isso o build passa, mas com aviso de deprecacao.
          - accepted_values:
              arguments:
                values:
                  - COMPLETED
                  - SHIPPED
                  - TO_CONFIRM_RECEIVE
                  - CANCELLED
                  - TO_RETURN
                  - READY_TO_SHIP
                  - UNPAID
                  - PROCESSED
              config:
                severity: warn

      - name: create_time
        description: "Data e hora em que o pedido foi feito, em UTC (3h a frente de Sao Paulo). E a data a usar para analises por periodo."

      - name: pay_time
        description: "Data e hora do pagamento, em UTC."

      - name: customer_type
        description: "'Novo' se foi a primeira compra do cliente, 'Recorrente' se ele ja havia comprado antes."

      - name: quantity_purchased
        description: "Unidades daquele item no pedido."

      - name: preco_tabela
        description: "Preco cheio unitario, sem desconto."

      - name: discounted_price
        description: "Preco de venda POR UNIDADE, com promocoes aplicadas. Nao confundir com preco_desconto_linha, que e o total."

      - name: preco_desconto_linha
        description: "Preco de venda DA LINHA INTEIRA (preco x quantidade), vindo do relatorio financeiro da Shopee."

      - name: cmv_unitario
        description: "Custo de uma unidade do produto, da planilha de custos. Nulo em pedidos anteriores a 2026-06-01 (produtos descontinuados) - isso e proposital."
        data_tests:
          - not_null:
              config:
                where: "create_time >= '2026-06-01'"

      - name: cmv_total
        description: "Custo total da linha: cmv_unitario x quantity_purchased."

      - name: receita_item
        description: "Valor de venda da linha: discounted_price x quantity_purchased."

      - name: margem_item
        description: >
          Sobra da linha considerando SO o custo do produto (receita_item - cmv_total).
          NAO desconta comissao da Shopee, frete, impostos nem cupons. Para resultado
          financeiro real use receita_bruta e receita_liquida.
        data_tests:
          - not_null:
              config:
                where: "create_time >= '2026-06-01'"

      - name: cupom_vendedor
        description: "Cupom que saiu do bolso do vendedor, ja rateado por item pela Shopee."

      - name: cupom_shopee
        description: "Cupom bancado pela Shopee. Nao reduz o faturamento do vendedor e nao entra no GMV."

      - name: gmv_item
        description: >
          Faturamento da linha: preco de venda menos o cupom do vendedor
          (definicao oficial Shopee 2026). INCLUI pedidos cancelados e devolvidos,
          porque mede volume de vendas geradas e nao dinheiro recebido.
          Fica NULO enquanto a Shopee nao liberar o escrow do pedido. Nulo aqui
          nao vira zero: o pedido some de sum(gmv_item) sem avisar. Foi assim que
          R$ 26,03 sumiram do GMV de julho/2026.
        data_tests:
          # So cobra escrow de pedido mais velho que a janela de releitura da
          # extracao (SHOPEE_REFRESH_WINDOW_DAYS, hoje 30 dias). Pedido recente
          # sem escrow e normal e nao pode derrubar o pipeline; pedido antigo sem
          # escrow e furo, porque a releitura ja nao alcanca mais ele.
          # warn_if/error_if: um caso preso avisa, quatro derrubam o build. Falhar
          # no primeiro bloquearia o warehouse inteiro por um pedido travado.
          - not_null:
              config:
                where: >
                  order_status not in ('CANCELLED', 'UNPAID')
                  and create_time < timestamp_sub(current_timestamp(), interval 30 day)
                severity: error
                warn_if: ">0"
                error_if: ">3"

      - name: receita_bruta
        description: "Repasse efetivo da Shopee para a linha, ja rateado por item. Zero em pedidos cancelados. Use ESTE campo para somar repasse, nunca escrow_amount."

      - name: receita_liquida
        description: "GMV menos 6% de imposto. Base do calculo: faturamento, conforme regime tributario."

      - name: comissao_shopee
        description: >
          Fatia do GMV retida pela Shopee, em decimal (0.3565 = 35,65%). Inclui
          comissao, taxa de servico, transacao e efeito do frete - nao e so a
          comissao contratual. Em pedidos cancelados marca 100%.
          Para a taxa media de um periodo use 1 - sum(receita_bruta)/sum(gmv_item),
          NUNCA avg(comissao_shopee), senao um pedido de R$20 pesa igual a um de R$200.

      - name: commission_fee
        description: "Comissao da Shopee em valor absoluto, isolada das demais taxas."

      - name: net_commission_fee
        description: "Comissao apos ajustes e rebates."

      - name: frete_pago_comprador
        description: "Valor de frete pago pelo comprador."

      - name: frete_custo_real
        description: "Custo real do frete. Se maior que o pago pelo comprador, a diferenca veio de subsidio da Shopee ou do vendedor."

      - name: valor_pago_produto
        description: "Valor dos produtos conforme o relatorio financeiro da Shopee."

      - name: escrow_amount
        description: >
          Repasse do PEDIDO INTEIRO, repetido em cada linha do mesmo pedido.
          NUNCA somar este campo: a soma fica inflada em pedidos multi-item.
          Para somar repasse use receita_bruta. Pode ser negativo em devolucoes.
  - name: despesa_operacional
    description: >
      Despesa operacional da loja, lancada a mao. Grao: competencia x canal x categoria
      x descricao, uma linha por mes. Regime de COMPETENCIA -- contrato anual pago de
      uma vez entra rateado, e o desembolso nao esta no warehouse.
      Despesa recorrente nao se propaga sozinha: mes sem lancamento significa que
      ninguem apurou, e o DRE deve parar na margem de contribuicao e declarar isso,
      nunca assumir que o valor do mes anterior continua valendo.
      NAO cobre imposto (ja em receita_liquida), nem CMV, embalagem e mao de obra
      (ja no custo do produto -- a loja opera sem estoque proprio).

    columns:
      - name: competencia
        description: "Mes a que a despesa se refere, sempre no dia 1o. Competencia, nao pagamento."
        data_tests:
          - not_null

      - name: canal
        description: >
          A que canal a despesa pertence: 'shopee', 'mercado_livre' ou 'comum'.
          'comum' e despesa do NEGOCIO, nao de um canal -- pro labore, assinaturas,
          consultoria. Ela NAO vem rateada de proposito: quem monta o DRE escolhe o
          criterio de rateio, e assim o criterio fica visivel em vez de escondido na
          digitacao da planilha.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['shopee', 'mercado_livre', 'comum']
              config:
                severity: warn

      - name: categoria
        description: >
          Tipo da despesa.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - assinaturas
                  - agencia_marketing
                  - consultoria
                  - pro_labore
              config:
                severity: warn

      - name: descricao
        description: "O item dentro da categoria (Canva, Avantpro, Pro labore). Faz parte do grao."
        data_tests:
          - not_null

      - name: valor
        description: "Valor mensal em reais. Sempre a parcela do mes, nunca o total do contrato."
        data_tests:
          - not_null

      - name: observacao
        description: "Texto livre: rateio aplicado, motivo, ou registro de que o gasto conferido foi zero."

  - name: master_ads
    description: >
      Desempenho de midia paga na Shopee. Cada linha e uma campanha num dia.
      Grao: campaign_id + data.
      O TOTAL DE GASTO DO DRE NAO SAI DAQUI -- sai de silver.stg_ads_shop_daily,
      que tem uma linha por dia no nivel da loja. Esta tabela serve para
      atribuir gasto por campanha e por produto. Medido em julho/2026: loja
      839.17 e soma das campanhas 839.20, tres centavos sobre 744 linhas.
      Cuidado com as metricas 'amplas' (broad): elas creditam a mesma venda a
      mais de uma campanha e NAO se somam entre campanhas.

    columns:
      - name: canal
        description: >
          Marketplace da campanha. Hoje constante em 'shopee'. Existe desde ja
          para o DRE por canal nascer funcionando dos dois lados, igual ao
          master_orders e a despesa_operacional.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['shopee', 'mercado_livre']
              config:
                severity: warn

      - name: campaign_id
        description: "Identificador da campanha na Shopee. Junte com stg_ads_campaign_setting por este campo, nunca por data: o setting nao tem data."
        data_tests:
          - not_null

      - name: data
        description: "Dia da metrica, no fuso de Brasilia. A API entrega em DD-MM-YYYY e a conversao acontece na extracao."
        data_tests:
          - not_null

      - name: nome_anuncio
        description: "Nome da campanha como aparece no painel de Ads. Vem da performance, nao da configuracao, entao reflete o nome vigente no periodo."

      - name: tipo_anuncio
        description: "manual, auto ou gms. Auto Product Ads esta sendo depreciado pela Shopee."

      - name: posicionamento
        description: "Onde o anuncio aparece. 'all' e o padrao das campanhas da loja."

      - name: item_id
        description: >
          Produto anunciado, para ligar gasto de midia a SKU. NULO quando a
          campanha nao aparece mais na listagem da Shopee -- campanha encerrada
          some, e o gasto historico dela fica aqui sem item. Nulo aqui e
          esperado, nao defeito.

      - name: qtd_itens
        description: >
          Quantos produtos a campanha anuncia. Em 02/09/2026 todas as 24
          campanhas tinham exatamente 1, e e essa premissa que permite guardar
          item_id como coluna. Se passar de 1, o gasto deixa de ser atribuivel
          a um SKU sem rateio arbitrario -- o teste assert_ads_campanha_um_item
          avisa, e o modelo precisa virar tabela ponte.

      - name: status_campanha
        description: "Estado atual da campanha: ongoing, closed, paused. E o estado de AGORA, nao o do dia da linha -- a Shopee nao expoe historico de configuracao."

      - name: orcamento_campanha
        description: "Orcamento configurado hoje. Mesmo aviso do status: e o valor atual, nao o vigente na data da linha."

      - name: meta_roas
        description: "Meta de ROAS quando o lance e automatico. Nulo em campanha de lance manual."

      - name: impressoes
        description: "Quantas vezes o anuncio foi exibido."

      - name: cliques
        description: "Cliques no anuncio."

      - name: ctr
        description: "Cliques dividido por impressoes, ja calculado pela Shopee. NAO tire media desta coluna para consolidar periodo -- media de razao nao e razao da media. Recalcule com sum(cliques)/sum(impressoes)."

      - name: gasto
        description: "Quanto a campanha gastou no dia, em reais. E o unico campo de dinheiro desta tabela que se soma sem ressalva. Ainda assim, o total do DRE sai do nivel loja."
        data_tests:
          - not_null

      - name: custo_por_clique
        description: "gasto/cliques do dia, ja calculado. Razao: nao tire media para consolidar, recalcule."

      - name: custo_por_conversao_direta
        description: "gasto por pedido direto, ja calculado. Razao: nao tire media para consolidar."

      - name: pedidos_diretos
        description: "Pedidos do proprio item anunciado, atribuidos ao clique. E o numero conservador."

      - name: gmv_direto
        description: >
          Faturamento gerado pelo item anunciado. Atribuicao de 7 dias creditada
          ao DIA DO CLIQUE: nunca vai bater com o master_orders do mesmo dia, e
          isso nao e erro. Sao perguntas diferentes -- 'quanto o anuncio de
          terca gerou' e 'quanto vendemos na terca'.

      - name: roi_direto
        description: "Retorno sobre investimento direto, ja calculado. No endpoint de loja a mesma ideia se chama direct_roas -- provavelmente a mesma metrica com outro nome, mas isso NAO foi verificado. Razao: nao tire media para consolidar."

      - name: cir_direto
        description: "Custo sobre receita direto (o inverso do ROI), ja calculado. Razao: nao tire media."

      - name: pedidos_amplos
        description: "Pedidos de QUALQUER item da loja depois do clique. NAO SOMAR ENTRE CAMPANHAS: a mesma venda e creditada a mais de uma campanha."

      - name: gmv_amplo
        description: >
          Faturamento de qualquer item da loja apos o clique. NAO SOMAR ENTRE
          CAMPANHAS -- credito duplicado, o mesmo defeito do escrow_amount no
          master_orders. Para total de loja, use stg_ads_shop_daily.

      - name: roi_amplo
        description: "ROI considerando venda ampla, ja calculado. Razao: nao tire media."

      - name: cir_amplo
        description: "Custo sobre receita amplo, ja calculado. Razao: nao tire media."

      - name: valor_pedidos_diretos
        description: "Valor dos pedidos diretos. Distinto do gmv_direto pela forma como a Shopee contabiliza; use gmv_direto salvo motivo especifico."

      - name: valor_pedidos_amplos
        description: "Valor dos pedidos amplos. Mesmo aviso de nao somar entre campanhas."

      - name: taxa_conversao
        description: "Conversao do dia, ja calculada. Razao: nao tire media para consolidar."

      - name: loaded_at
        description: "Quando a linha foi carregada no bronze. A releitura de 30 dias reprocessa o mesmo dia varias vezes, e o silver mantem a versao mais recente."

  - name: master_keywords
    description: >
      Volume de busca da Shopee por palavra, com serie temporal. Cada linha e
      uma palavra, para um item, num snapshot semanal.
      Grao: item_id + palavra + data_snapshot.
      EXISTE POR CAUSA DO SNAPSHOT: o volume da Shopee e uma janela movel de 30
      dias sem historico, entao sem esta tabela "esse termo cresceu" e uma frase
      impossivel de dizer. Snapshot nao coletado esta PERDIDO -- nao ha backfill,
      diferente do master_orders e do master_ads, que releem e se autocorrigem.
      CUIDADO PRINCIPAL: volume_busca e do TERMO na Shopee inteira, nao do nosso
      item. A mesma palavra aparece para varios itens com o mesmo volume --
      somar entre itens conta a mesma busca varias vezes.

    columns:
      - name: canal
        description: >
          Marketplace da consulta. Hoje constante em 'shopee'. Existe desde ja
          pelo mesmo motivo das outras tabelas do gold.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['shopee', 'mercado_livre']
              config:
                severity: warn

      - name: item_id
        description: "Produto a partir do qual a palavra foi sugerida. A Shopee exige um item para responder: nao existe consulta de termo solto."
        data_tests:
          - not_null

      - name: palavra
        description: "O termo de busca. Texto livre, com espaco e acento. Faz parte do grao."
        data_tests:
          - not_null

      - name: data_snapshot
        description: "Data da coleta semanal. E o eixo do tempo desta tabela -- sem ele nao ha serie."
        data_tests:
          - not_null

      - name: volume_busca
        description: >
          Buscas pelo termo nos ultimos 30 dias, na Shopee INTEIRA. NAO e busca
          pelo nosso produto e NAO tem relacao direta com venda. NAO SOMAR entre
          itens: a mesma palavra aparece para varios itens com o mesmo valor, e
          somar conta a mesma busca duas vezes. Para o volume de um termo, use
          max ou filtre um item.
        data_tests:
          - not_null

      - name: qualidade
        description: "quality_score da Shopee, de 1 a 10. Quao relevante o termo e para o item. Alto volume com qualidade baixa costuma ser termo generico demais."

      - name: lance_sugerido
        description: "Lance em reais que a Shopee sugere para anunciar neste termo. Serve ao Inacio para estimar custo antes de criar campanha."

      - name: no_catalogo
        description: >
          Se o item estava ativo na loja NAQUELE snapshot. Produto pausado
          continua sendo coletado de proposito -- a Caminha Pet saiu do ar em
          agosto por falta de estoque no fornecedor e vai voltar; quando voltar,
          a serie dela nao tera buraco.

      - name: volume_anterior
        description: "Volume da MESMA palavra no MESMO item, no snapshot anterior. Nulo no primeiro snapshot de cada palavra -- esperado, nao defeito."

      - name: variacao_absoluta
        description: "volume_busca menos volume_anterior. Numero de buscas ganhas ou perdidas na semana. Nulo no primeiro snapshot."

      - name: variacao_pct
        description: "Variacao percentual contra o snapshot anterior. Nula quando o volume anterior era zero ou nao existe. Leia junto do absoluto: 100% sobre 50 buscas e ruido."

      - name: posicao_no_item
        description: "Ranking da palavra dentro do item naquele snapshot, 1 = mais buscada. Atalho para 'as 5 mais buscadas deste produto'."

      - name: loaded_at
        description: "Quando a linha foi carregada no bronze. Se a coleta for reexecutada no mesmo dia apos falha, o silver mantem a leitura mais recente."
